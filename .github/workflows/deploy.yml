name: Deploy knowMe to S3 and CloudFront

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'knowledge-base/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowme-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        run: |
          for variable in AWS_ROLE_ARN AWS_REGION S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Set the $variable GitHub Actions variable before deploying."
              exit 1
            fi
          done

      - name: Validate and stage public files
        shell: bash
        run: |
          node --check assets/js/main.js
          node --check assets/js/theme.js
          test -s index.html
          test -s 404.html
          test -s assets/css/style.css
          test -s assets/css/themes.css
          test -s assets/img/mithila-border.svg
          test -s assets/img/mithila-vine.svg
          mkdir -p "$RUNNER_TEMP/knowme-site"
          cp -R assets knowledge-base "$RUNNER_TEMP/knowme-site/"
          cp -- *.html robots.txt sitemap.xml "$RUNNER_TEMP/knowme-site/"

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: knowme-${{ github.run_id }}

      - name: Upload assets
        shell: bash
        run: |
          aws s3 cp "$RUNNER_TEMP/knowme-site/assets/" "s3://$S3_BUCKET/assets/" \
            --recursive --no-follow-symlinks --only-show-errors \
            --cache-control 'public, max-age=0, must-revalidate'

      - name: Publish pages
        shell: bash
        run: |
          aws s3 cp "$RUNNER_TEMP/knowme-site/" "s3://$S3_BUCKET/" \
            --recursive --no-follow-symlinks --only-show-errors \
            --exclude '*' --include '*.html' --include 'robots.txt' --include 'sitemap.xml' \
            --cache-control 'public, max-age=0, must-revalidate'

      - name: Invalidate CloudFront cache
        shell: bash
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation_id"
          printf '### Deployment complete\n\nUploaded the site and completed CloudFront invalidation `%s`.\n' \
            "$invalidation_id" >> "$GITHUB_STEP_SUMMARY"